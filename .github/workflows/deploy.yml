name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker
        run: docker build -t employeemanagementbackend:latest .
        
      - name: Save Docker image
        run: docker save employeemanagementbackend:latest | gzip > employeemanagementbackend-latest.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: employeemanagementbackend-latest.tar.gz
          retention-days: 7

      - name: Create Release Assets
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ems-backend-jar
          path: target/ems-backend-*.jar

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ems-backend-jar/ems-backend-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable GitHub Dependabot
        run: echo "GitHub Dependabot will scan dependencies. Enable in Settings - Security & Analysis"
        continue-on-error: true
